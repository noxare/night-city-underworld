name: NPC simulation core checks
on:
  push:
    paths:
      - 'underworld/nemesis.py'
      - 'underworld/nemesis_mailbox.py'
      - 'underworld/nemesis_director.py'
      - 'mods/night_city_underworld/encounters.lua'
      - 'underworld/offscreen.py'
      - 'tests/test_nemesis_core.py'
      - 'tests/test_nemesis_mailbox.py'
      - 'tests/test_nemesis_recovery.py'
      - 'tests/test_nemesis_scenario.py'
      - 'tests/test_nemesis_director.py'
      - 'tests/test_nemesis_lua_pipeline.py'
      - 'tests/test_automatic_encounters.py'
      - 'tests/lua_harness.py'
      - 'tests/test_offscreen.py'
      - '.github/workflows/npc-core-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npc-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npc-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Lua test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0
      - name: Check automatic capture, durable encounters and recovery
        env:
          PYTHONPATH: tests
        run: python -m unittest test_nemesis_core test_nemesis_mailbox test_nemesis_recovery test_nemesis_scenario test_nemesis_director test_nemesis_lua_pipeline test_automatic_encounters test_offscreen -v
