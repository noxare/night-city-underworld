name: NPC simulation core checks
on:
  push:
    paths:
      - 'underworld/nemesis.py'
      - 'underworld/offscreen.py'
      - 'tests/test_nemesis_core.py'
      - 'tests/test_offscreen.py'
      - '.github/workflows/npc-core-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npc-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npc-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check durable identities and offscreen simulation
        run: python -m unittest tests.test_nemesis_core tests.test_offscreen -v
