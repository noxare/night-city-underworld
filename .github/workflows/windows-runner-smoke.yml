name: Windows runner smoke test
on:
  push:
    paths:
      - '.github/workflows/windows-runner-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify environment and safe read access
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "=== Underworld runner check ==="
          Write-Host ("OS: " + [Environment]::OSVersion.VersionString)
          Write-Host ("64-bit: " + [Environment]::Is64BitOperatingSystem)
          Write-Host ("Runner: " + $env:RUNNER_NAME)
          Write-Host ("User: " + [Environment]::UserName)
          Write-Host ("Workspace readable: " + (Test-Path $env:GITHUB_WORKSPACE))
          Write-Host ("Profile readable: " + (Test-Path $env:USERPROFILE))
          Write-Host ("PowerShell version: " + $PSVersionTable.PSVersion)
          foreach ($name in @('git','python','py','node','npm','dotnet','cargo','rustc','cmake','code','REDmod','WolvenKit.CLI')) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            Write-Host ("Tool " + $name + ": " + [bool]$cmd)
          }
          $steam = Get-ItemProperty -Path 'HKCU:\Software\Valve\Steam' -ErrorAction SilentlyContinue
          Write-Host ("Steam user registry accessible: " + [bool]$steam)
          if ($steam -and $steam.SteamPath) {
            Write-Host ("Steam install folder readable: " + (Test-Path $steam.SteamPath))
          }
          $candidatePaths = @(
            'C:\Program Files (x86)\Steam\steamapps\common\Cyberpunk 2077',
            'C:\Program Files\Steam\steamapps\common\Cyberpunk 2077',
            'C:\GOG Games\Cyberpunk 2077'
          )
          Write-Host ("Cyberpunk in common default locations: " + [bool](@($candidatePaths | Where-Object { Test-Path $_ }).Count))
          Write-Host ("Repo directory readable: " + (Test-Path (Join-Path $env:GITHUB_WORKSPACE '.git')))

          $steamRoot = if ($steam -and $steam.SteamPath) { $steam.SteamPath -replace '/', '\' } else { '' }
          $libraries = @()
          if ($steamRoot) { $libraries += $steamRoot }
          $vdf = if ($steamRoot) { Join-Path $steamRoot 'steamapps\libraryfolders.vdf' } else { '' }
          if ($vdf -and (Test-Path $vdf)) {
            $vdfText = Get-Content $vdf -Raw
            foreach ($match in [regex]::Matches($vdfText, '"path"\s+"([^"]+)"')) {
              $libraries += $match.Groups[1].Value.Replace('\\','\')
            }
          }
          $libraries = @($libraries | Select-Object -Unique)
          $manifestFound = $false
          $exeFound = $false
          foreach ($library in $libraries) {
            if (Test-Path (Join-Path $library 'steamapps\appmanifest_1091500.acf')) { $manifestFound = $true }
            if (Test-Path (Join-Path $library 'steamapps\common\Cyberpunk 2077\bin\x64\Cyberpunk2077.exe')) { $exeFound = $true }
          }
          Write-Host ("Steam libraries found: " + $libraries.Count)
          Write-Host ("Cyberpunk Steam manifest accessible: " + $manifestFound)
          Write-Host ("Cyberpunk executable readable: " + $exeFound)

          foreach ($library in $libraries) {
            $game = Join-Path $library 'steamapps\common\Cyberpunk 2077'
            if (-not (Test-Path (Join-Path $game 'bin\x64\Cyberpunk2077.exe'))) { continue }
            Write-Host "=== Cyberpunk mod frameworks ==="
            $checks = [ordered]@{
              'CET asi' = 'bin\x64\version.dll'
              'CET directory' = 'bin\x64\plugins\cyber_engine_tweaks'
              'RED4ext loader' = 'bin\x64\RED4ext.dll'
              'RED4ext plugins' = 'red4ext\plugins'
              'redscript scripts' = 'r6\scripts'
              'ArchiveXL directory' = 'archive\pc\mod'
              'REDmod tools' = 'tools\redmod'
              'REDmod mods' = 'mods'
            }
            foreach ($k in $checks.Keys) {
              Write-Host ("Framework check " + $k + ": " + (Test-Path (Join-Path $game $checks[$k])))
            }
            $plugins = Join-Path $game 'red4ext\plugins'
            if (Test-Path $plugins) {
              $names = @(Get-ChildItem -LiteralPath $plugins -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              Write-Host ("RED4ext plugin directory names: " + ($names -join ', '))
            }
            $scripts = Join-Path $game 'r6\scripts'
            if (Test-Path $scripts) {
              $names = @(Get-ChildItem -LiteralPath $scripts -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name)
              Write-Host ("redscript directory names: " + ($names -join ', '))
            }
            break
          }
          Write-Host "Probe complete - no modifications performed"
