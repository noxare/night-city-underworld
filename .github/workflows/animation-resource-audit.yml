name: Audit installed animation resources
on:
  push:
    branches: [main]
    paths: ['.github/workflows/animation-resource-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified isolated WolvenKit Console and inspect CLI
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'NightCityUnderworld\tools\WolvenKit-9.1.0'
          New-Item -ItemType Directory -Force -Path $root|Out-Null
          $zip=Join-Path $root 'console.zip'
          function Get-ArchiveHash([string]$path,[string]$algorithm='sha256') {
            $value=python -c "import hashlib,sys;print(hashlib.new(sys.argv[2],open(sys.argv[1],'rb').read()).hexdigest())" $path $algorithm
            if($LASTEXITCODE -ne 0){throw 'Archive hash failed'}
            return $value.Trim()
          }
          $expected='7caf49cdf0f478b484b1a5a27e5aef261b879fabea7e72e33ca60eff3b834f4f'
          if(-not(Test-Path $zip) -or (Get-ArchiveHash $zip) -ne $expected){
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/WolvenKit/WolvenKit/releases/download/9.1.0/WolvenKit.Console-9.1.0.zip' -OutFile $zip
          }
          if((Get-ArchiveHash $zip) -ne $expected){throw 'Official WolvenKit archive checksum mismatch'}
          $bin=Join-Path $root 'bin'
          if(-not(Test-Path $bin)){python -c "import zipfile,sys;zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" $zip $bin
            if($LASTEXITCODE -ne 0){throw 'Console extraction failed'}}
          $executables=@(Get-ChildItem $bin -Filter '*.exe' -File -Recurse)
          $executables|ForEach-Object {Write-Host ('Package executable: '+$_.Name)}
          $tool=@($executables|Where-Object {$_.Name -like '*WolvenKit*' -or $_.Name -like '*wconsole*'}|Select-Object -First 1)
          if($tool.Count -ne 1){throw 'Console executable not found'}
          $cli=$tool[0].FullName
          Write-Host ('Verified CLI: '+$cli)
          $runtimeRoot=Join-Path $root 'dotnet10'
          $runtimeExe=Join-Path $runtimeRoot 'dotnet.exe'
          if(-not(Test-Path $runtimeExe)){
            $metadata=Invoke-RestMethod -Uri 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
            $release=@($metadata.releases|Where-Object {$_.'release-version' -eq $metadata.'latest-release'}|Select-Object -First 1)[0]
            $asset=@($release.runtime.files|Where-Object {$_.rid -eq 'win-x64' -and $_.name -like 'dotnet-runtime*.zip'}|Select-Object -First 1)[0]
            if(-not $asset -or ([uri]$asset.url).Host -notin @('builds.dotnet.microsoft.com','download.visualstudio.microsoft.com','ci.dot.net')){throw 'Unexpected .NET runtime asset'}
            Write-Host ('Runtime asset: '+$asset.name+' '+$asset.url)
            $runtimeZip=Join-Path $root 'dotnet-runtime10.zip'
            Invoke-WebRequest -UseBasicParsing -Uri $asset.url -OutFile $runtimeZip
            if((Get-ArchiveHash $runtimeZip 'sha512') -ne $asset.hash.ToLower()){throw '.NET runtime checksum mismatch'}
            python -c "import zipfile,sys;zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" $runtimeZip $runtimeRoot
            if($LASTEXITCODE -ne 0){throw '.NET runtime extraction failed'}
            Write-Host ('Isolated .NET runtime version: '+$release.runtime.version)
          }
          if(-not(Test-Path $runtimeExe)){
            Write-Host 'Runtime archive inventory:'
            python -c "import zipfile,sys;z=zipfile.ZipFile(sys.argv[1]);print(chr(10).join(z.namelist()[:25]));print('HOSTS', [n for n in z.namelist() if n.lower().endswith('dotnet.exe')])" (Join-Path $root 'dotnet-runtime10.zip')
            $hosts=@(Get-ChildItem $runtimeRoot -Filter dotnet.exe -File -Recurse|Select-Object -First 1)
            if($hosts.Count -eq 1){$runtimeExe=$hosts[0].FullName;$runtimeRoot=$hosts[0].DirectoryName}
          }
          if(-not(Test-Path $runtimeExe)){throw 'Verified runtime package contains no located dotnet host'}
          $env:DOTNET_ROOT=$runtimeRoot
          $env:DOTNET_ROOT_X64=$runtimeRoot
          $assembly=Join-Path $tool[0].DirectoryName 'WolvenKit.CLI.dll'
          & $runtimeExe $assembly --help
          if($LASTEXITCODE -ne 0){throw 'Console help failed'}
          & $runtimeExe $assembly unbundle --help
          & $runtimeExe $assembly convert --help
          & $runtimeExe $assembly convert serialize --help
          python -m unittest discover -s tests -p test_animation_audit.py -v
          if($LASTEXITCODE -ne 0){throw 'Bounded audit tests failed'}
          $outputRoot=Join-Path $env:LOCALAPPDATA ('NightCityUnderworld\a\r'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          $game='H:\SteamLibrary\steamapps\common\Cyberpunk 2077'
          python scripts/audit_animation_resources.py --cli $cli --game $game --output $outputRoot
          if($LASTEXITCODE -ne 0){throw 'Animation resource audit failed'}
          Write-Host ('Local audit manifest: '+(Join-Path $outputRoot 'manifest.json'))
          exit 0
